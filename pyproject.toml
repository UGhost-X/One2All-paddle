[project]
name = "one2all-paddle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115.12",
    "setuptools>=80.9.0",
    "uvicorn>=0.34.3",
    "opencv-contrib-python",
    "numpy<2",
    "pypdfium2",
    "scikit-image",
    "pydantic",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.22",
    "jinja2>=3.1.0",
    "psutil",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "anomalib>=1.0.0",
    "lightning>=2.0.0",
    "kornia>=0.7.0",
    "jsonargparse>=4.0.0",
    "omegaconf>=2.3.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "FrEIA>=0.2",
    "pyturbojpeg>=1.7.0",
    "pypylon>=2.0.0",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
index-strategy = "unsafe-best-match"
