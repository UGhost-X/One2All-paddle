# FN/Normal 图像增强配置
# YOLO 内置增强已关闭，所有增强由此接管

__version__: 1.4.0
transform:
  __class_fullname__: Compose
  additional_targets: {}
  bbox_params: null
  keypoint_params: null
  p: 1.0
  transforms:
    # 水平翻转
    - __class_fullname__: HorizontalFlip
      p: 0.5

    # 垂直翻转
    - __class_fullname__: VerticalFlip
      p: 0.5

    # 90° 旋转（转置翻转）
    - __class_fullname__: Transpose
      p: 0.3

    # 轻微旋转 (±10°)
    - __class_fullname__: Rotate
      limit: [-10, 10]
      interpolation: 1
      border_mode: 0
      rotate_method: largest_box
      crop_border: false
      p: 0.3

    # 轻微缩放
    - __class_fullname__: Affine
      scale: [0.85, 1.15]
      keep_ratio: true
      rotate: 0
      shear: 0
      translate_percent: 0
      p: 0.4

    # 模糊增强（Gaussian / Motion / Median 三选一）
    - __class_fullname__: OneOf
      p: 0.3
      transforms:
        - __class_fullname__: GaussianBlur
          blur_limit: [3, 5]
          sigma_limit: [0.1, 1.0]
          p: 1.0
        - __class_fullname__: MotionBlur
          blur_limit: [3, 5]
          p: 1.0
        - __class_fullname__: MedianBlur
          blur_limit: [3, 5]
          p: 1.0

    # 轻微亮度/对比度调整
    # 亮度/对比度由代码中 AdaptiveBrightnessContrast 接管（暗图不更暗，亮图不更亮）
