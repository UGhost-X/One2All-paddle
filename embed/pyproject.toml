[project]
name = "one2all-paddle-embedded"
version = "0.1.0"
description = "One2All Paddle Embedded Python Environment"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.3",
    "opencv-contrib-python>=4.8.0",
    "numpy<2",
    "pypdfium2>=4.0.0",
    "scikit-image>=0.21.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.22",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pypylon>=2.0.0",
    "anomalib>=1.0.0",
    "lightning>=2.0.0",
    "kornia>=0.7.0",
    "jsonargparse>=4.0.0",
    "omegaconf>=2.3.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "FrEIA>=0.2",
    "pyturbojpeg>=1.7.0",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
priority = "supplemental"

[tool.uv]
index-strategy = "unsafe-best-match"
python-preference = "only-system"
